# ================================================================================
# OpenAI-compatible proxy service configuration
# ================================================================================

# Backend configuration.
# Each key is a backend name; profiles can refer to these names.
backends:
  # MiniMax backend.
  glm-5-fp8:
    base_url: "https://api.minimaxi.com/anthropic"
    api_key: null
    timeout_s: 600
    max_retries: 1
    retry_delay_s: 0.5
    endpoints:
      - url: "https://api.minimaxi.com/anthropic"
        model: "MiniMax-M2.7"
        api_key: "${MINIMAX_API_KEY}"
        openai_url: "https://api.minimaxi.com"
    load_balance: "least_connections"
    max_concurrent: 0
    requests_per_minute: 0

  # GLM backend.
  GLM-5-FP8:
    base_url: "https://ark.cn-beijing.volces.com/api/coding"
    api_key: "${ARK_API_KEY}"
    timeout_s: 600
    max_retries: 1
    retry_delay_s: 0.5
    endpoints:
      - url: "https://ark.cn-beijing.volces.com/api/coding"
        model: "glm-5.1"
    load_balance: "least_connections"
    max_concurrent: 0
    requests_per_minute: 0

  # Kimi coding backend.
  minimax2.5:
    base_url: "https://api.kimi.com/coding/"
    api_key: "${KIMI_API_KEY}"
    timeout_s: 600
    max_retries: 1
    retry_delay_s: 0.5
    endpoints:
      - url: "https://api.kimi.com/coding/"
        model: "kimi-for-coding/k2p6"
        openai_url: "https://api.kimi.com/coding/"
        extra_headers:
          User-Agent: "claude-code/2.1.888"
    load_balance: "least_connections"  # Prefer the endpoint with the fewest active connections.
    max_concurrent: 0
    requests_per_minute: 0

# Default backend.
default_backend: "glm-5-fp8"

# Coding agent listener profiles.
profiles:
  opencode:
    port: 8905
    protocol: "openai"
    backend: "minimax2.5"
    session_dir: "traces/opencode"
    usage_json: "usage/opencode/usage.json"
    require_agent_header: false

  claude-code:
    port: 8906
    protocol: "anthropic"
    backend: "glm-5-fp8"
    session_dir: "traces/claude-code"
    usage_json: "usage/claude-code/usage.json"
    require_agent_header: false

  hermes:
    port: 8907
    protocol: "openai"
    backend: "GLM-5-FP8"
    session_dir: "traces/hermes"
    usage_json: "usage/hermes/usage.json"
    require_agent_header: false

# OpenClaw uses proxy/openclaw_proxy.py, not the shared profile core.
# Keep its runtime settings here so model/provider configuration lives in one file.
openclaw:
  port: 8908
  backend: "GLM-5-FP8"
  session_dir: "traces/openclaw"

# Authentication configuration.
auth:
  enabled: false
  keys: []
  keys_file: null

# Metrics configuration.
metrics:
  enabled: true
  path: "/metrics"

# Shared proxy defaults.
proxy:
  port: 8905
  connect_timeout_s: 10
  stream_chunk_size: 8192
  debug: false
  trace: false
  session_json: null
  usage_json: "usage.json"
